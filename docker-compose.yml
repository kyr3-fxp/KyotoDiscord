version: '3.8'

services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kyoto_discord_bot
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
    # Evita que el contenedor caiga en loop si no hay conectividad inmediata
    stop_grace_period: 10s
